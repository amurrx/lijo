<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<body class="theme-dark catalog-page">
  <header class="site-header glass">
    <div class="logo-block"><p class="logo-mark">BXL</p><h1>beatsbylijo</h1></div>

    <section class="catalog-grid">
      <article class="catalog-card glass"><div class="wave"></div><h4>Crimson Drift</h4><p>140 BPM • Dark Trap</p><div class="card-footer"><button>▶</button><span>$75</span><button>Add</button></div></article>

    </section>
