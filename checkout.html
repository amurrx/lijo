<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beatsbylijo | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-dark checkout-page">
  <header class="site-header glass">
    <div class="logo-block"><p class="logo-mark">BXL</p><h1>beatsbylijo</h1></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="checkout.html" class="active">Cart & Checkout</a>
    </nav>
  </header>

  <main class="checkout-layout">
    <section class="cart glass">
      <h3>Selected Beats</h3>
      <div class="line"><span>Redline V12</span><span>$79</span></div>
      <div class="line"><span>Pacific Switch</span><span>$65</span></div>
      <div class="line total"><span>Total</span><span>$144</span></div>
    </section>

    <section class="checkout-form glass">
      <h3>License & Payment</h3>
      <label>License Type
        <select><option>Premium WAV Lease</option><option>Unlimited</option><option>Exclusive</option></select>
      </label>
      <label>Promo Code
        <input type="text" placeholder="ENTER CODE" />
      </label>
      <label>Card Number
        <input type="text" placeholder="•••• •••• •••• ••••" />
      </label>
      <div class="split">
        <label>Expiry<input type="text" placeholder="MM/YY" /></label>
        <label>CVC<input type="text" placeholder="CVC" /></label>
      </div>
      <button class="btn btn-primary">Complete Purchase</button>
    </section>
  </main>
</body>
</html>
